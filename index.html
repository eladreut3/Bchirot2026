<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a8a" />
  <title>בחירות 2026 - משחק ניחושים משפחתי</title>
  <meta property="og:title" content="בחירות 2026 - משחק ניחושים משפחתי" />
  <meta property="og:description" content="כמה מנדטים כל מפלגה תקבל? שלחו את הניחוש שלכם!" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗳️</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Rubik', 'system-ui', 'sans-serif'] } } }
    };
  </script>

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .card-in { animation: cardIn .45s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

    .shake { animation: shake .4s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }

    .pop { animation: pop .25s ease-out; }
    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }

    .bg-mesh {
      background:
        radial-gradient(at 15% 10%, rgba(59,130,246,.18) 0, transparent 50%),
        radial-gradient(at 85% 0%, rgba(14,165,233,.15) 0, transparent 45%),
        radial-gradient(at 50% 100%, rgba(99,102,241,.12) 0, transparent 50%),
        #f8fafc;
    }
    .confetti { position: fixed; top: -10px; width: 10px; height: 14px; z-index: 60; pointer-events: none;
      animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .7; } }
  </style>
</head>

<body class="bg-mesh min-h-screen font-sans text-slate-800 antialiased">

  <header class="relative overflow-hidden bg-gradient-to-br from-blue-900 via-blue-700 to-sky-500 text-white">
    <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle at 1px 1px, white 1px, transparent 0); background-size: 22px 22px;"></div>
    <div class="relative max-w-2xl mx-auto px-5 pt-10 pb-16 text-center">
      <div class="text-5xl mb-3">🗳️</div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight leading-tight">בחירות 2026</h1>
      <p class="text-lg sm:text-xl font-medium text-blue-100 mt-1">משחק ניחושים משפחתי</p>
      <p class="mt-4 text-sm text-blue-100/90">חלקו בדיוק <b class="text-white">120 מנדטים</b> בין המפלגות ושלחו את הניחוש שלכם</p>
    </div>
    <svg class="absolute bottom-0 w-full text-slate-50" viewBox="0 0 1440 60" preserveAspectRatio="none" fill="currentColor"><path d="M0,40 C360,80 1080,0 1440,40 L1440,60 L0,60 Z"/></svg>
  </header>

  <main class="max-w-2xl mx-auto px-4 -mt-8 pb-48 relative">

    <form id="guessForm" novalidate>
      <section class="card-in bg-white rounded-2xl shadow-lg shadow-blue-900/5 ring-1 ring-slate-200/70 p-5 mb-5">
        <label for="guesserName" class="block text-base font-bold text-slate-700 mb-2">שם המנחש</label>
        <input id="guesserName" type="text" maxlength="40" autocomplete="name" placeholder="לדוגמה: סבתא רחל"
          class="w-full rounded-xl border-2 border-slate-200 bg-slate-50 px-4 py-3 text-lg focus:outline-none focus:border-blue-500 focus:bg-white transition" />
      </section>

      <div class="flex items-center justify-between mb-3 px-1">
        <h2 class="text-lg font-bold text-slate-700">המפלגות</h2>
        <button type="button" id="resetBtn" class="text-sm text-slate-500 hover:text-red-600 transition">↺ איפוס</button>
      </div>
      <div id="partiesList" class="grid gap-3"></div>
    </form>

    <section id="successView" class="hidden card-in bg-white rounded-3xl shadow-xl ring-1 ring-slate-200 p-8 text-center mt-2">
      <div class="text-6xl mb-3">🎉</div>
      <h2 class="text-2xl font-extrabold text-slate-800">הניחוש נשלח בהצלחה!</h2>
      <p class="text-slate-500 mt-2">תודה <span id="successName" class="font-bold text-blue-700"></span>, נתראה בליל הבחירות 📺</p>
      <div id="successSummary" class="mt-6 grid gap-1.5 text-right"></div>
      <button id="newGuessBtn" class="mt-8 w-full rounded-xl bg-slate-100 hover:bg-slate-200 py-3 font-bold text-slate-700 transition">ניחוש חדש (משתתף אחר)</button>
    </section>
  </main>

  <div id="stickyBar" class="fixed bottom-0 inset-x-0 z-40 pb-[env(safe-area-inset-bottom)]">
    <div class="max-w-2xl mx-auto px-3 pb-3">
      <div class="bg-white/90 backdrop-blur-xl rounded-2xl shadow-2xl shadow-slate-900/20 ring-1 ring-slate-200 p-4">
        <div id="overWarning" class="hidden mb-2 rounded-lg bg-red-50 text-red-600 text-center font-bold py-1.5 text-sm">
          ⚠️ עברת את רף ה-120 מנדטים!
        </div>
        <div class="flex items-center justify-between gap-3">
          <div class="min-w-0">
            <div id="counterText" class="text-base sm:text-lg font-bold text-slate-700 transition-colors">
              מנדטים שנותרו לחלוקה: <span id="remaining" class="inline-block tabular-nums text-blue-700 text-2xl font-extrabold">120</span>
            </div>
            <div class="text-xs text-slate-400 mt-0.5">סה״כ חולקו: <span id="totalUsed" class="tabular-nums">0</span> / 120</div>
          </div>
          <button id="submitBtn" type="button" disabled
            class="shrink-0 rounded-xl px-5 py-3 font-bold text-white bg-gradient-to-l from-blue-600 to-sky-500 shadow-lg shadow-blue-600/30
                   transition enabled:hover:scale-[1.03] enabled:active:scale-95
                   disabled:from-slate-300 disabled:to-slate-300 disabled:shadow-none disabled:cursor-not-allowed">
            שלח ניחוש
          </button>
        </div>
        <div class="mt-3 h-2 rounded-full bg-slate-100 overflow-hidden">
          <div id="progressBar" class="h-full rounded-full bg-gradient-to-l from-blue-600 to-sky-400 transition-all duration-300" style="width:0%"></div>
        </div>
        <p id="hint" class="text-xs text-slate-400 mt-2 text-center"></p>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed top-4 inset-x-4 z-50 mx-auto max-w-md rounded-xl px-4 py-3 text-center font-bold text-white shadow-xl
       opacity-0 -translate-y-4 pointer-events-none transition-all duration-300"></div>

<script>
/* ===== Google Apps Script Web App URL ===== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywQ1jFfIYBW4q8380FdRgePUl0rS1R5G8Iy5_lX0SB6Z-eXqDbkpGgvZt5qQZpgRf5/exec";

const TOTAL = 120;
const PARTIES = [
  { name: "הליכוד - ביבי",           color: "#1d4ed8" },
  { name: "ישר - איזנקוט",           color: "#0891b2" },
  { name: "ביחד - בנט",              color: "#0f766e" },
  { name: "הציונות הדתית - סמוטריץ", color: "#b45309" },
  { name: "הדמוקרטים - יאיר גולן",   color: "#dc2626" },
  { name: "רע\"מ",                   color: "#15803d" },
  { name: "המשותפת הערבים",          color: "#65a30d" },
  { name: "אביגדור ליברמן",          color: "#1e40af" },
  { name: "וינטר",                   color: "#7c3aed" },
  { name: "הנדל-זליכה",              color: "#c026d3" },
  { name: "ש\"ס",                    color: "#0f172a" },
  { name: "יהדות התורה",             color: "#475569" },
    { name: "עוצמה יהודית", color: "#ea580c" },

];
const DRAFT_KEY = "elections2026_draft";

const $ = (id) => document.getElementById(id);
const list = $("partiesList"), nameInput = $("guesserName"), submitBtn = $("submitBtn");
let submitting = false;

PARTIES.forEach((p, i) => {
  const card = document.createElement("div");
  card.className = "card-in group bg-white rounded-2xl shadow-sm ring-1 ring-slate-200/70 p-3 pr-4 flex items-center gap-3 transition hover:shadow-md focus-within:ring-2 focus-within:ring-blue-400";
  card.style.animationDelay = `${i * 40}ms`;
  card.innerHTML = `
    <span class="w-1.5 self-stretch rounded-full" style="background:${p.color}"></span>
    <div class="flex-1 min-w-0">
      <div class="font-bold text-slate-800 truncate">${p.name}</div>
      <div class="mt-1.5 h-1.5 rounded-full bg-slate-100 overflow-hidden">
        <div data-bar="${i}" class="h-full rounded-full transition-all duration-300" style="width:0%;background:${p.color}"></div>
      </div>
    </div>
    <div class="flex items-center gap-1.5" dir="ltr">
      <button type="button" data-step="-1" data-idx="${i}" aria-label="הפחת"
        class="w-10 h-10 rounded-xl bg-slate-100 text-xl font-bold text-slate-600 active:scale-90 hover:bg-slate-200 transition">−</button>
      <input type="number" inputmode="numeric" min="0" max="120" placeholder="0" data-idx="${i}" aria-label="${p.name}"
        class="party-input w-14 h-10 rounded-xl border-2 border-slate-200 text-center text-lg font-bold tabular-nums focus:outline-none focus:border-blue-500 transition" />
      <button type="button" data-step="1" data-idx="${i}" aria-label="הוסף"
        class="w-10 h-10 rounded-xl bg-slate-100 text-xl font-bold text-slate-600 active:scale-90 hover:bg-slate-200 transition">+</button>
    </div>`;
  list.appendChild(card);
});
const inputs = [...document.querySelectorAll(".party-input")];

const clamp = (v) => Math.max(0, Math.min(TOTAL, v));
const val = (inp) => { const n = parseInt(inp.value, 10); return Number.isFinite(n) ? n : 0; };
const sum = () => inputs.reduce((s, inp) => s + val(inp), 0);

function update() {
  const total = sum(), remaining = TOTAL - total, over = total > TOTAL;
  const remEl = $("remaining");
  if (remEl.textContent !== String(remaining)) { remEl.classList.remove("pop"); void remEl.offsetWidth; remEl.classList.add("pop"); }
  remEl.textContent = remaining;
  $("totalUsed").textContent = total;

  $("counterText").classList.toggle("text-red-600", over);
  remEl.classList.toggle("text-red-600", over);
  remEl.classList.toggle("text-emerald-600", total === TOTAL);
  remEl.classList.toggle("text-blue-700", !over && total !== TOTAL);
  $("overWarning").classList.toggle("hidden", !over);

  const bar = $("progressBar");
  bar.style.width = Math.min(100, (total / TOTAL) * 100) + "%";
  bar.className = "h-full rounded-full transition-all duration-300 " +
    (over ? "bg-red-500" : total === TOTAL ? "bg-emerald-500" : "bg-gradient-to-l from-blue-600 to-sky-400");

  inputs.forEach((inp, i) => {
    document.querySelector(`[data-bar="${i}"]`).style.width = Math.min(100, (val(inp) / TOTAL) * 100 * 2.5) + "%";
    inp.classList.toggle("border-red-400", over && val(inp) > 0);
  });

  const hasName = nameInput.value.trim().length > 0;
  submitBtn.disabled = submitting || total !== TOTAL || !hasName;
  $("hint").textContent =
    over ? `הורידו ${total - TOTAL} מנדטים כדי לשלוח` :
    total < TOTAL ? `נותרו ${remaining} מנדטים לחלוקה` :
    !hasName ? "נא למלא את שם המנחש למעלה ☝️" : "מעולה! אפשר לשלוח ✅";

  saveDraft();
}

inputs.forEach((inp) => {
  inp.addEventListener("input", () => {
    if (inp.value === "") return update();
    inp.value = clamp(parseInt(inp.value.replace(/\D/g, ""), 10) || 0);
    update();
  });
  inp.addEventListener("focus", () => inp.select());
});
list.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-step]");
  if (!btn) return;
  const inp = inputs[+btn.dataset.idx];
  inp.value = clamp(val(inp) + +btn.dataset.step);
  if (navigator.vibrate) navigator.vibrate(8);
  update();
});
nameInput.addEventListener("input", update);
$("resetBtn").addEventListener("click", () => {
  if (!confirm("לאפס את כל המספרים?")) return;
  inputs.forEach((i) => (i.value = "")); update();
});
$("newGuessBtn").addEventListener("click", () => {
  inputs.forEach((i) => (i.value = "")); nameInput.value = "";
  $("successView").classList.add("hidden"); $("guessForm").classList.remove("hidden");
  $("stickyBar").classList.remove("hidden"); update(); window.scrollTo({ top: 0, behavior: "smooth" });
});

function saveDraft() {
  localStorage.setItem(DRAFT_KEY, JSON.stringify({ name: nameInput.value, values: inputs.map((i) => i.value) }));
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY));
    if (!d) return;
    nameInput.value = d.name || "";
    d.values?.forEach((v, i) => inputs[i] && (inputs[i].value = v));
  } catch {}
}

function toast(msg, ok = true) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.remove("bg-emerald-600", "bg-red-600");
  t.classList.add(ok ? "bg-emerald-600" : "bg-red-600");
  t.classList.remove("opacity-0", "-translate-y-4");
  setTimeout(() => t.classList.add("opacity-0", "-translate-y-4"), 3500);
}

submitBtn.addEventListener("click", async () => {
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); nameInput.parentElement.classList.add("shake"); setTimeout(() => nameInput.parentElement.classList.remove("shake"), 400); return; }
  if (sum() !== TOTAL) return;

  const payload = { name, votes: inputs.map(val) };

  submitting = true; update();
  submitBtn.innerHTML = `<span class="inline-block w-4 h-4 border-2 border-white/60 border-t-white rounded-full animate-spin align-middle ml-1"></span> שולח...`;

  try {
    const res = await fetch(SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
      redirect: "follow",
    });
    const data = await res.json();
    if (data.status !== "success") throw new Error(data.message || "Unknown error");

    localStorage.removeItem(DRAFT_KEY);
    showSuccess(name, payload.votes);
  } catch (err) {
    console.error(err);
    toast("אופס! השליחה נכשלה. בדקו חיבור ונסו שוב.", false);
  } finally {
    submitting = false;
    submitBtn.textContent = "שלח ניחוש";
    update();
  }
});

function showSuccess(name, votes) {
  $("successName").textContent = name;
  $("successSummary").innerHTML = PARTIES
    .map((p, i) => ({ ...p, v: votes[i] }))
    .filter((p) => p.v > 0)
    .sort((a, b) => b.v - a.v)
    .map((p) => `<div class="flex justify-between items-center rounded-lg bg-slate-50 px-3 py-2">
        <span class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full" style="background:${p.color}"></span>${p.name}</span>
        <b class="tabular-nums">${p.v}</b></div>`).join("");
  $("guessForm").classList.add("hidden");
  $("stickyBar").classList.add("hidden");
  $("successView").classList.remove("hidden");
  window.scrollTo({ top: 0, behavior: "smooth" });
  confetti();
}

function confetti() {
  const colors = ["#2563eb", "#0ea5e9", "#f59e0b", "#10b981", "#ef4444", "#a855f7"];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2 + Math.random() * 2 + "s";
    c.style.animationDelay = Math.random() * 0.5 + "s";
    c.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

loadDraft();
update();
</script>
</body>
</html>
